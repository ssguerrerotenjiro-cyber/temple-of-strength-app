<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Ruta base de la app. `flutter build web --base-href /app/` la reemplaza. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Temple of Strength en tu navegador: entrena, sube de rango en cada músculo, construye tu templo y habla con Tenshi, tu coach con IA. La misma cuenta que en la app.">
  <meta name="theme-color" content="#06050A">
  <meta name="color-scheme" content="dark">

  <!-- iPhone: «Agregar a inicio» la abre a pantalla completa, como una app. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Temple">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Temple of Strength · versión web</title>

  <style>
    html, body { margin: 0; height: 100%; background: #06050A; }
    body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }

    /* Pantalla de carga: se ve mientras llega la app y se desvanece sola. */
    #carga {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(120% 70% at 80% 0%, #1b1233 0%, #09070F 55%, #06050A 100%);
      color: #9A93B0; font: 500 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .5s ease;
    }
    #carga.fuera { opacity: 0; pointer-events: none; }
    #carga img { width: 112px; height: 112px; animation: flotar 3.2s ease-in-out infinite; filter: drop-shadow(0 0 26px rgba(139, 92, 246, .45)); }
    #carga .nombre { color: #F4F1FA; font-size: 19px; font-weight: 700; letter-spacing: .5px; }
    #carga .barra { width: 148px; height: 3px; border-radius: 3px; background: #1D1829; overflow: hidden; }
    #carga .barra i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #8B5CF6; animation: avanzar 1.3s ease-in-out infinite; }
    @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes avanzar { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #carga img, #carga .barra i { animation: none; } }

    /* Consejo para iPhone: instalarla en la pantalla de inicio. */
    #instalar-ios {
      position: fixed; left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top)); z-index: 30;
      max-width: 420px; margin: 0 auto; box-sizing: border-box;
      display: flex; gap: 12px; align-items: flex-start; padding: 14px 14px 14px 16px;
      background: #15121F; border: 1px solid #3D3157; border-radius: 18px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .55), 0 0 30px rgba(139, 92, 246, .18);
      color: #E7E3F2; font: 400 13.5px/1.45 system-ui, -apple-system, sans-serif;
      transform: translateY(-160%); transition: transform .45s cubic-bezier(.2, .8, .2, 1);
    }
    #instalar-ios.visible { transform: translateY(0); }
    #instalar-ios b { color: #F4F1FA; }
    #instalar-ios .texto { flex: 1; }
    #instalar-ios svg { width: 17px; height: 17px; vertical-align: -3px; }
    #instalar-ios button {
      flex: none; width: 30px; height: 30px; border: 0; border-radius: 15px; background: #1D1829; color: #9A93B0;
      font-size: 18px; line-height: 30px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="carga" role="status" aria-live="polite">
    <img src="icons/logo-carga.png" alt="">
    <div class="nombre">Temple of Strength</div>
    <div class="barra"><i></i></div>
    <div>Abriendo el templo…</div>
  </div>

  <div id="instalar-ios" hidden>
    <div class="texto">
      <b>Tenla como app en tu iPhone.</b> Abajo, toca Compartir
      <svg viewBox="0 0 24 24" fill="none" stroke="#B79CFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Compartir"><path d="M12 3v12"/><path d="m8 7 4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>
      y luego <b>«Agregar a inicio»</b>.
    </div>
    <button type="button" aria-label="Cerrar">×</button>
  </div>

  <noscript>
    <p style="color:#E7E3F2;font-family:system-ui,sans-serif;padding:24px">Temple of Strength necesita JavaScript activado.</p>
  </noscript>

  <script>
    // Quitar la pantalla de carga cuando la app dibuja su primera pantalla.
    window.addEventListener('flutter-first-frame', function () {
      var c = document.getElementById('carga');
      if (!c) return;
      c.classList.add('fuera');
      setTimeout(function () { c.remove(); }, 600);
    });

    // En iPhone (Safari) y sin instalar: sugerir «Agregar a inicio», como mucho una vez por semana.
    (function () {
      var ua = navigator.userAgent || '';
      var ios = /iPhone|iPod/.test(ua) || (/iPad/.test(ua));
      var instalada = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      if (!ios || instalada) return;
      var clave = 'templo_consejo_inicio';
      try {
        var antes = Number(localStorage.getItem(clave) || 0);
        if (Date.now() - antes < 7 * 24 * 3600 * 1000) return;
      } catch (e) { /* sin almacenamiento: se muestra igual */ }
      var caja = document.getElementById('instalar-ios');
      var cerrar = function () {
        caja.classList.remove('visible');
        try { localStorage.setItem(clave, String(Date.now())); } catch (e) {}
        setTimeout(function () { caja.hidden = true; }, 500);
      };
      caja.querySelector('button').addEventListener('click', cerrar);
      setTimeout(function () {
        caja.hidden = false;
        requestAnimationFrame(function () { caja.classList.add('visible'); });
        setTimeout(cerrar, 15000);
      }, 4500);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
