name: temple_of_strength
description: Temple of Strength, entrenamiento con alma de dojo.
publish_to: 'none'

# Sube este número en cada versión nueva: 1.0.1, 1.0.2… El número de
# compilación lo pone solo GitHub en cada construcción.
version: 1.8.0+9

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: any
  http: any
  supabase_flutter: any
  image_picker: any
  video_player: any
  shared_preferences: any
  url_launcher: any
  google_mobile_ads: any
  audioplayers: any
  # La 23.0.0 (6 nov 2026) exige compilar contra Android 37, que el Gradle
  # actual aún no admite. Se queda en la 22 o anterior hasta actualizar Gradle.
  flutter_local_notifications: '<23.0.0'
  timezone: any
  crypto: any
  # Camino del día (sección 61, solo en la app instalada). Rangos acotados para
  # que una versión nueva de un paquete no rompa la compilación.
  flutter_map: '>=8.2.0 <9.0.0'
  flutter_map_vector_tiles: '>=2.10.1 <3.0.0'
  latlong2: '>=0.9.1 <0.11.0'
  geolocator: '>=14.0.0 <15.0.0'
  pedometer: '>=4.1.0 <5.0.0'
  # permission_handler_android 14 exige compilar contra Android 37 (como
  # flutter_local_notifications 23): se queda en la 13 hasta actualizar Gradle.
  permission_handler: '>=12.0.0 <13.0.0'
  permission_handler_android: '>=13.0.0 <14.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - assets/sonidos/
    - assets/mapa/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icono/icono.png"
  adaptive_icon_background: "#06050A"
  adaptive_icon_foreground: "assets/icono/icono_frente.png"
