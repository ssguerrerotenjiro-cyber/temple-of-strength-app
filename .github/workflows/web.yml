name: Construir web

# La misma app, compilada para el navegador (Android, iPhone y computador).
# Se prueba en Chromium y en WebKit (el motor de Safari) y el resultado queda
# en la rama `web-build`: `app/` es lo que se publica en la página, en /app/,
# y `pruebas/` trae las capturas de cada navegador.
on:
  push:
    branches: [main, web]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear el proyecto web
        run: |
          flutter create --org com.templeofstrength --project-name temple_of_strength --platforms web .
          cp -r ci/web/. web/

      - name: Paquetes
        run: flutter pub get

      - name: Compilar
        id: compilar
        run: |
          # WebAssembly corre el código más rápido en Chrome, Edge, Firefox y
          # Safari reciente; los navegadores viejos reciben la versión en
          # JavaScript sola. Si algún paquete no es compatible, se compila solo JS.
          WASM=true
          if ! flutter build web --release --wasm --base-href /app/ --no-web-resources-cdn; then
            echo "::warning::No se pudo compilar con WebAssembly; se publica solo JavaScript."
            WASM=false
            flutter build web --release --base-href /app/ --no-web-resources-cdn
          fi
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          printf '{"version":"%s","compilacion":%s,"commit":"%s","fecha":"%s","wasm":%s}\n' \
            "$VERSION" "${{ github.run_number }}" "${{ github.sha }}" "$(date -u +%FT%TZ)" "$WASM" > build/web/version.json
          du -sh build/web

      - name: Compilar vista de prueba
        # Solo fuera de main: abre los módulos sin cuenta para revisar los temas
        # con capturas (60.5). Nunca se publica.
        if: github.ref != 'refs/heads/main'
        run: |
          mv build/web build/web_publicable
          flutter build web --release --dart-define=VISTA_PRUEBA=true --base-href /prueba/ --no-web-resources-cdn
          mv build/web build/prueba
          mv build/web_publicable build/web

      - name: Probar en navegadores
        id: probar
        timeout-minutes: 20
        run: |
          python3 -m pip install --quiet playwright
          # Chrome ya viene en el servidor de GitHub. Instalar WebKit con sus
          # dependencias tardó más de media hora, así que se intenta sin ellas y
          # con tiempo límite: si no queda listo, esa prueba se omite.
          if ! command -v google-chrome >/dev/null; then timeout 600 python3 -m playwright install chromium; fi
          timeout 300 python3 -m playwright install webkit || echo "::warning::WebKit no se instaló; se prueba en Chrome."
          mkdir -p sitio && cp -r build/web sitio/app
          (cd sitio && nohup python3 -m http.server 8123 >/dev/null 2>&1 &)
          sleep 2
          python3 ci/probar_web.py http://127.0.0.1:8123/app/ salida
          python3 ci/medir_web.py http://127.0.0.1:8123/app/ salida/rendimiento.json 8 || echo "::warning::No se pudo medir el rendimiento."

      - name: Guardar en la rama web-build
        if: always() && steps.compilar.outcome == 'success'
        run: |
          mkdir -p rama
          cp -r build/web rama/app
          cp -r salida rama/pruebas 2>/dev/null || true
          cp -r build/prueba rama/prueba 2>/dev/null || true
          echo '${{ steps.probar.outcome }}' > rama/pruebas/estado.txt 2>/dev/null || true
          cd rama
          git init -q -b web-build
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Web ${{ steps.compilar.outputs.version }} (compilación ${{ github.run_number }})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" web-build
