name: Probar camino

# Prueba el Camino del día en un emulador Android con ubicación simulada:
# compila la vista de prueba (abre el Dojo sin cuenta), da los permisos,
# simula una caminata y guarda las capturas en la rama pruebas/camino-<n>.
# Solo para revisar; nunca se publica.
on:
  push:
    branches: [camino]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: camino-${{ github.ref }}
  cancel-in-progress: true

jobs:
  camino:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear el proyecto Android
        run: flutter create --org com.templeofstrength --project-name temple_of_strength --platforms android .

      - name: Ajustar Android
        run: python3 ci/preparar_android.py

      - name: Paquetes
        run: flutter pub get

      - name: Construir APK de prueba
        run: |
          flutter build apk --release --dart-define=VISTA_PRUEBA=true --target-platform android-x64 --build-number=${{ github.run_number }}
          mkdir -p salida
          cp build/app/outputs/flutter-apk/app-release.apk salida/prueba.apk
          ls -la salida

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Consola del emulador sin clave, para simular la ubicación con «adb emu geo fix».
          : > ~/.emulator_console_auth_token

      - name: Caminar en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API: 34
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: false
          # El emulador se caía al dibujar el Dojo con swiftshader_indirect (con y
          # sin Vulkan). Se prueba con SwiftShader sobre ANGLE y más memoria.
          ram-size: 3072M
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./ci/probar_camino.sh salida/prueba.apk

      - name: Diagnóstico del servidor
        if: always()
        run: |
          free -m || true
          sudo dmesg 2>/dev/null | grep -iE "oom|killed process|qemu|segfault" | tail -20 || true
          ls -la /tmp/android-runner 2>/dev/null || true

      - name: Informe de cierre del emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulador-${{ github.run_number }}
          path: /tmp/android-runner/
          if-no-files-found: ignore

      - name: Guardar capturas y registro
        if: always()
        run: |
          [ -d resultado ] || exit 0
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          RAMA="pruebas/camino-${{ github.run_number }}"
          git checkout -q --orphan "$RAMA"
          git rm -rq --cached . || true
          git add -f resultado
          git commit -qm "Prueba del camino, compilación ${{ github.run_number }}"
          git push -qf origin "HEAD:refs/heads/$RAMA"
