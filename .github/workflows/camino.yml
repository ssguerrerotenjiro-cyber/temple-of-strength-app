name: Probar camino

# Prueba el Camino del día en un emulador Android con ubicación simulada:
# compila la vista de prueba (abre el Dojo sin cuenta), da los permisos,
# simula una caminata y guarda las capturas en la rama pruebas/camino-<n>.
# Solo para revisar; nunca se publica.
on:
  push:
    branches: [camino]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: camino-${{ github.ref }}
  cancel-in-progress: true

jobs:
  camino:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear el proyecto Android
        run: flutter create --org com.templeofstrength --project-name temple_of_strength --platforms android .

      - name: Ajustar Android
        run: python3 ci/preparar_android.py

      - name: Paquetes
        run: flutter pub get

      - name: Construir APK de prueba
        run: |
          flutter build apk --release --dart-define=VISTA_PRUEBA=true --target-platform android-x64 --build-number=${{ github.run_number }}
          mkdir -p salida
          cp build/app/outputs/flutter-apk/app-release.apk salida/prueba.apk
          # Variante sin Impeller (Skia), por si el GPU por software del emulador
          # no aguanta Impeller.
          sed -i 's#</application>#    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />\n    </application>#' android/app/src/main/AndroidManifest.xml
          flutter build apk --release --dart-define=VISTA_PRUEBA=true --target-platform android-x64 --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk salida/prueba_skia.apk
          # Control: el Dojo de main (sin el camino), con Impeller, para saber
          # si la caída del emulador con Impeller ya pasaba antes.
          git fetch -q origin main
          git checkout -q origin/main -- lib pubspec.yaml
          rm -f lib/camino_app.dart lib/camino_web.dart
          sed -i '/EnableImpeller/d' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release --dart-define=VISTA_PRUEBA=true --target-platform android-x64 --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk salida/control_main.apk
          ls -la salida

      - uses: actions/upload-artifact@v4
        with:
          name: prueba-camino-${{ github.run_number }}
          path: salida/

  emulador:
    needs: camino
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # Con Impeller, el emulador se cae al tomar la captura de pantalla
          # (le pasa al GPU por software); con Skia se ve igual y no se cae.
          - nombre: api30-skia
            api: 30
            apk: prueba_skia.apk
          - nombre: api34-impeller
            api: 34
            apk: prueba.apk
          - nombre: api34-control-main
            api: 34
            apk: control_main.apk
          - nombre: api34-skia
            api: 34
            apk: prueba_skia.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prueba-camino-${{ github.run_number }}
          path: salida/

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Consola del emulador sin clave, para simular la ubicación con «adb emu geo fix».
          : > ~/.emulator_console_auth_token

      - name: Caminar en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: false
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./ci/probar_camino.sh salida/${{ matrix.apk }}

      - name: Diagnóstico del servidor
        if: always()
        run: |
          free -m || true
          sudo dmesg 2>/dev/null | grep -iE "oom|killed process|qemu|segfault" | tail -20 || true
          ls -la /tmp/android-runner 2>/dev/null || true

      - name: Informe de cierre del emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulador-${{ github.run_number }}-${{ matrix.nombre }}
          path: /tmp/android-runner/
          if-no-files-found: ignore

      - name: Guardar capturas y registro
        if: always()
        run: |
          [ -d resultado ] || exit 0
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          RAMA="pruebas/camino-${{ github.run_number }}-${{ matrix.nombre }}"
          git checkout -q --orphan "$RAMA"
          git rm -rq --cached . || true
          git add -f resultado
          git commit -qm "Prueba del camino, compilación ${{ github.run_number }}"
          git push -qf origin "HEAD:refs/heads/$RAMA"
