name: Probar en emulador

on:
  push:
    branches: [prueba-emulador]
    paths-ignore: ['resultado/**']

permissions:
  contents: write

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [34, 30]
    steps:
      - uses: actions/checkout@v4
      - name: Bajar el APK publicado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.3.0-5 -p TempleOfStrength.apk
          ls -la TempleOfStrength.apk
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          $AAPT dump badging TempleOfStrength.apk | grep -E "package:|sdkVersion|targetSdk|native-code|launchable"
          $AAPT dump xmltree TempleOfStrength.apk AndroidManifest.xml | grep -B2 -A3 -E "meta-data|receiver" | head -80
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar y abrir
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./ci/probar_emulador.sh
      - name: Guardar resultado en la rama
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add resultado
          git commit -m "Resultado emulador API ${{ matrix.api }}"
          for i in 1 2 3 4 5; do git pull --rebase -q origin prueba-emulador && git push -q origin HEAD:prueba-emulador && break; sleep 5; done
