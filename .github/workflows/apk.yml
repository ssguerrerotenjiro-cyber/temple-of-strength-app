name: Construir APK

# Cada cambio en el código construye un APK nuevo, firmado, lo prueba en
# emuladores (Android 11 y 14) y, solo si abre bien, lo publica como «Release».
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.info.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear el proyecto Android
        run: flutter create --org com.templeofstrength --project-name temple_of_strength --platforms android .

      - name: Llave de firma
        env:
          LLAVE_BASE64: ${{ secrets.LLAVE_BASE64 }}
          LLAVE_CLAVE: ${{ secrets.LLAVE_CLAVE }}
        run: |
          if [ -n "$LLAVE_BASE64" ] && [ -n "$LLAVE_CLAVE" ]; then
            echo "$LLAVE_BASE64" | base64 -d > android/app/templo-llave.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=templo\nstoreFile=templo-llave.jks\n' "$LLAVE_CLAVE" "$LLAVE_CLAVE" > android/key.properties
            echo "Firmando con la llave del templo."
          else
            echo "::warning::No hay llave de firma en los secretos: el APK se firma con una llave de prueba."
          fi

      - name: Ajustar Android (internet, nombre, icono, AdMob, firma)
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: python3 ci/preparar_android.py

      - name: Paquetes e icono
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Construir APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Construir AAB (para Google Play)
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Preparar archivo
        id: info
        run: |
          mkdir -p salida
          cp build/app/outputs/flutter-apk/app-release.apk salida/TempleOfStrength.apk
          cp build/app/outputs/bundle/release/app-release.aab salida/TempleOfStrength.aab
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+]+).*/\1/')
          BYTES=$(stat -c %s salida/TempleOfStrength.apk)
          MB=$(python3 -c "print(round($BYTES/1048576))")
          SHA=$(sha256sum salida/TempleOfStrength.apk | cut -d' ' -f1)
          FIRMADO=false; [ -f android/key.properties ] && FIRMADO=true
          printf '{"version":"%s","build":%s,"tamano":"%s MB","sha256":"%s","firmado":%s}\n' "$VERSION" "${{ github.run_number }}" "$MB" "$SHA" "$FIRMADO" > salida/apk-info.json
          cat salida/apk-info.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: TempleOfStrength-${{ steps.info.outputs.version }}-${{ github.run_number }}
          path: salida/


  probar:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [34, 30]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TempleOfStrength-${{ needs.apk.outputs.version }}-${{ github.run_number }}
          path: salida/
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir la app en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./ci/probar_emulador.sh salida/TempleOfStrength.apk
      - name: Guardar capturas y registro
        if: always()
        run: |
          [ -d resultado ] || exit 0
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          RAMA="pruebas/${{ github.run_number }}-api${{ matrix.api }}"
          git checkout -q --orphan "$RAMA"
          git rm -rq --cached . || true
          git add -f resultado
          git commit -qm "Prueba de la compilación ${{ github.run_number }} en API ${{ matrix.api }}"
          git push -qf origin "HEAD:refs/heads/$RAMA"

  publicar:
    needs: [apk, probar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TempleOfStrength-${{ needs.apk.outputs.version }}-${{ github.run_number }}
          path: salida/
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ needs.apk.outputs.version }}-${{ github.run_number }}"
          gh release create "$TAG" salida/TempleOfStrength.apk salida/TempleOfStrength.aab salida/apk-info.json \
            -R "${{ github.repository }}" \
            --title "Temple of Strength ${{ needs.apk.outputs.version }} (compilación ${{ github.run_number }})" \
            --notes "APK construido desde ${{ github.sha }} y probado en Android 11 y 14." --latest
